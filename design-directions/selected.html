<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リレーブックス｜採用案 スマートフォンA・PCB</title>
<meta name="description" content="リレーブックスのデザイン方向性 採用案。スマートフォンは案Aの構成、PCは案Bの構成。">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#F6F6F4;
  --paper-2:#EFEFEC;
  --ink:#26292C;
  --ink-muted:#64696D;
  --brand:#7F6447;
  --line:#C7C9C5;
  --mincho:"Zen Old Mincho", serif;
  --latin:"EB Garamond", serif;
  --gutter:clamp(1.25rem, 5vw, 5rem);
  --stroke:1px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--mincho);
  font-weight:400;
  letter-spacing:.06em;
  line-height:2;
  font-feature-settings:"palt" 1;
}
img{display:block; max-width:100%}
:focus-visible{outline:2px solid var(--brand); outline-offset:3px}

/* ==========================================================
   ファーストビュー
   スマートフォン: 案A 縦書きのキャッチと、全高を貫く縦の軸
   PC(768px以上) : 案B 中央組と、画面端から端まで通る横の線
   要素の並び替えはグリッドの領域指定で行う。HTMLの順序は
   ロゴ→キャッチ→線→サブコピーのまま変えない
   ========================================================== */
.hero{
  min-height:100dvh;
  max-width:1000px;
  margin-inline:auto;
  padding-inline:var(--gutter);
  padding-block:clamp(1.5rem,4vh,3rem) clamp(2rem,6vh,4rem);
  display:grid;
  grid-template-columns:1fr auto auto;
  grid-template-rows:auto 1fr auto;
  grid-template-areas:
    "logo rule catch"
    ".    rule catch"
    "sub  rule catch";
  column-gap:clamp(1.1rem,3vw,2.25rem);
  row-gap:clamp(2rem,5vh,3.5rem);
}
.logo{grid-area:logo}
.logo img{width:clamp(150px,21vw,200px); height:auto}
.catch{
  grid-area:catch;
  writing-mode:vertical-rl;
  align-self:start;
  margin:clamp(.25rem,2vh,1.5rem) 0 0;
  font-weight:500;
  font-size:clamp(1.5rem,5.2vw,2rem);
  line-height:1.95;
  letter-spacing:.2em;
}
/* 受け渡しを表す一本の線。ページで唯一の動きをここに置く */
.rule{
  grid-area:rule;
  width:var(--stroke);
  background:var(--brand);
  transform-origin:top center;
  animation:draw-down 1500ms cubic-bezier(.16,1,.3,1) 250ms both;
}
@keyframes draw-down{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.sub{
  grid-area:sub;
  align-self:end;
  margin:0;
  font-size:clamp(.82rem,3.2vw,1rem);
  letter-spacing:.16em;
  color:var(--ink-muted);
}

@media (min-width:768px){
  .hero{
    max-width:none;
    grid-template-columns:1fr;
    grid-template-rows:repeat(4, auto);
    grid-template-areas:"logo" "catch" "rule" "sub";
    align-content:center;
    justify-items:center;
    text-align:center;
    row-gap:0;
    padding-block:clamp(2rem,6vh,4rem);
  }
  .logo img{width:clamp(180px,16vw,232px)}
  .catch{
    writing-mode:horizontal-tb;
    align-self:auto;
    margin:clamp(2.75rem,8vh,5rem) 0 0;
    font-size:clamp(1.9rem,4.2vw,2.6rem);
    line-height:2.05;
    text-indent:.2em;
  }
  .rule{
    justify-self:stretch;
    width:auto;
    height:var(--stroke);
    margin-block:clamp(2.25rem,7vh,4rem);
    margin-inline:calc(var(--gutter) * -1);
    transform-origin:left center;
    animation-name:draw-across;
  }
  @keyframes draw-across{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .sub{
    align-self:auto;
    letter-spacing:.18em;
    text-indent:.18em;
  }
}

/* ==========================================================
   はじまり
   ========================================================== */
.story{padding-inline:var(--gutter); padding-block:clamp(5rem,14vh,10rem)}
.story-inner{
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:clamp(1.5rem,5vw,4.5rem);
}
.sec-head{display:flex; gap:clamp(.85rem,2vw,1.4rem)}
.rule-s{width:var(--stroke); background:var(--line)}
.sec-title{
  writing-mode:vertical-rl;
  margin:0;
  font-weight:500;
  font-size:clamp(1rem,3.4vw,1.3rem);
  letter-spacing:.32em;
  line-height:1;
}
.sec-latin{
  writing-mode:vertical-rl;
  font-family:var(--latin);
  font-size:.7rem;
  letter-spacing:.44em;
  line-height:1;
  color:var(--ink-muted);
  margin-top:1.4em;
}
.prose{min-width:0}
.prose p{
  margin:0 0 1.9em;
  max-width:32ch;
  font-size:clamp(.95rem,3.6vw,1.05rem);
  line-height:2.2;
}
.prose p:last-of-type{margin-bottom:0}

/* 写真プレースホルダー（有料素材に差し替え） */
.ph{
  margin:clamp(3rem,8vh,5rem) 0 0;
  max-width:560px;
  margin-inline-start:auto;
  border:var(--stroke) solid var(--line);
  background:var(--paper-2);
  aspect-ratio:3/2;
  display:grid;
  place-items:center;
  padding:1.25rem;
}
.ph span{
  font-size:.76rem;
  letter-spacing:.12em;
  line-height:1.95;
  color:var(--ink-muted);
  text-align:center;
}

@media (max-width:767px){
  .prose br.pc{display:none}
  .story-inner{gap:1.5rem}
  .prose p{max-width:none}
  .ph{margin-inline-start:0}
}
@media (prefers-reduced-motion: reduce){
  .rule{animation:none}
}
</style>
</head>
<body>

<header class="hero">
  <div class="logo">
    <img src="../assets/logo/relay-books-logo.webp" width="1134" height="491"
         alt="リレーブックス RELAY BOOKS">
  </div>

  <h1 class="catch">本が、<br>人の物語になる場所。</h1>

  <div class="rule" aria-hidden="true"></div>

  <p class="sub">この町に、もう一度本屋を。</p>
</header>

<main>
  <section class="story">
    <div class="story-inner">
      <div class="sec-head">
        <div class="rule-s" aria-hidden="true"></div>
        <div>
          <h2 class="sec-title">はじまり</h2>
          <div class="sec-latin">STORY</div>
        </div>
      </div>

      <div class="prose">
        <p>【町名】には、少し前まで本屋がありました。<br class="pc">その本屋が閉まり、町から本屋がなくなりました。</p>
        <p>隣の町まで行けば本屋はあるし、ネットでも本は買えます。<br class="pc">それでも、自分の町に本屋がないことが、さみしかった。</p>
        <p>本屋は、本を売るだけの場所ではありません。<br class="pc">本に出会い、手に取り、読んでみようかなと思える場所。<br class="pc">この町から、本を読む文化をなくしたくない。<br class="pc">それが、リレーブックスのはじまりです。</p>

        <figure class="ph">
          <span>写真｜町の風景、または本棚の一部<br>横長 3:2 ／ 有料素材に差し替え</span>
        </figure>
      </div>
    </div>
  </section>
</main>

</body>
</html>

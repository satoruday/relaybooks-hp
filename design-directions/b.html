<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リレーブックス｜デザイン案B 淡い青灰と受け渡しの線</title>
<meta name="description" content="リレーブックスのデザイン方向性 案B。ファーストビューと「はじまり」セクションの見本。">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#E9EDEE;
  --paper-2:#DFE5E6;
  --ink:#1F2326;
  --ink-muted:#5C6469;
  --brand:#7A5A38;
  --line:#B4BCBE;
  --mincho:"Shippori Mincho", serif;
  --latin:"Cormorant Garamond", serif;
  --gutter:clamp(1.25rem, 5vw, 5rem);
  --stroke:1px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--mincho);
  font-weight:400;
  letter-spacing:.06em;
  line-height:2;
  font-feature-settings:"palt" 1;
}
svg{display:block}
:focus-visible{outline:2px solid var(--brand); outline-offset:3px}

/* ---------- ファーストビュー ---------- */
.hero{
  min-height:100dvh;
  display:grid;
  align-content:center;
  justify-items:center;
  text-align:center;
  padding-inline:var(--gutter);
  padding-block:clamp(2rem,6vh,4rem);
}
.logo{color:var(--brand)}
.logo svg{width:clamp(96px,15vw,140px); height:auto; margin-inline:auto}
.logo-type{
  margin-top:.9em;
  font-family:var(--latin);
  font-size:clamp(.64rem,2.2vw,.78rem);
  letter-spacing:.46em;
  line-height:1;
  color:var(--brand);
  text-indent:.46em;
}
.catch{
  margin:clamp(2.75rem,8vh,5rem) 0 0;
  font-weight:500;
  font-size:clamp(1.42rem,6vw,2.5rem);
  line-height:2.05;
  letter-spacing:.2em;
  text-indent:.2em;
}
/* 受け渡しの線：画面端から端まで通す */
.hero-rule{
  justify-self:stretch;
  margin-inline:calc(var(--gutter) * -1);
  height:var(--stroke);
  background:var(--brand);
  margin-block:clamp(2.25rem,7vh,4rem);
  transform-origin:left center;
  animation:draw-across 1700ms cubic-bezier(.16,1,.3,1) 250ms both;
}
@keyframes draw-across{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sub{
  margin:0;
  font-size:clamp(.82rem,3.2vw,1rem);
  letter-spacing:.18em;
  text-indent:.18em;
  color:var(--ink-muted);
}

/* ---------- はじまり ---------- */
.story{padding-inline:var(--gutter); padding-block:clamp(5rem,14vh,10rem)}
.story-inner{
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr auto;
  gap:clamp(1.5rem,5vw,4.5rem);
}
.sec-head{
  grid-column:2;
  display:flex;
  flex-direction:row-reverse;
  gap:clamp(.85rem,2vw,1.4rem);
}
.rule-s{width:var(--stroke); background:var(--line)}
.sec-title{
  writing-mode:vertical-rl;
  margin:0;
  font-weight:500;
  font-size:clamp(1rem,3.4vw,1.3rem);
  letter-spacing:.32em;
  line-height:1;
}
.sec-latin{
  writing-mode:vertical-rl;
  font-family:var(--latin);
  font-size:.74rem;
  letter-spacing:.46em;
  line-height:1;
  color:var(--ink-muted);
  margin-top:1.4em;
}
.prose{grid-column:1; min-width:0}
.prose p{
  margin:0 0 1.9em;
  max-width:34ch;
  font-size:clamp(.95rem,3.6vw,1.05rem);
  line-height:2.2;
}
.prose p:last-of-type{margin-bottom:0}

/* 写真プレースホルダー（有料素材に差し替え）：左端まで伸ばす */
.ph{
  margin:clamp(3rem,8vh,5rem) 0 0;
  margin-inline-start:calc(var(--gutter) * -1);
  border:var(--stroke) solid var(--line);
  border-inline-start:0;
  background:var(--paper-2);
  aspect-ratio:3/2;
  display:grid;
  place-items:center;
  padding:1.25rem;
}
.ph span{
  font-size:.76rem;
  letter-spacing:.12em;
  line-height:1.95;
  color:var(--ink-muted);
  text-align:center;
}

@media (max-width:767px){
  .prose br.pc{display:none}
  .story-inner{gap:1.5rem}
  .prose p{max-width:none}
}
@media (prefers-reduced-motion: reduce){
  .hero-rule{animation:none}
}
</style>
</head>
<body>

<header class="hero">
  <div class="logo">
    <svg viewBox="0 0 64 32" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" role="img" aria-label="リレーブックス">
      <path d="M4 6C18 8 28 17 40 29"/>
      <path d="M60 6C46 8 36 17 24 29"/>
    </svg>
    <div class="logo-type">RELAY BOOKS</div>
  </div>

  <h1 class="catch">本が、<br>人の物語になる場所。</h1>

  <div class="hero-rule" aria-hidden="true"></div>

  <p class="sub">この町に、もう一度本屋を。</p>
</header>

<main>
  <section class="story">
    <div class="story-inner">
      <div class="sec-head">
        <div class="rule-s" aria-hidden="true"></div>
        <div>
          <h2 class="sec-title">はじまり</h2>
          <div class="sec-latin">STORY</div>
        </div>
      </div>

      <div class="prose">
        <p>【町名】には、少し前まで本屋がありました。<br class="pc">その本屋が閉まり、町から本屋がなくなりました。</p>
        <p>隣の町まで行けば本屋はあるし、ネットでも本は買えます。<br class="pc">それでも、自分の町に本屋がないことが、さみしかった。</p>
        <p>本屋は、本を売るだけの場所ではありません。<br class="pc">本に出会い、手に取り、読んでみようかなと思える場所。<br class="pc">この町から、本を読む文化をなくしたくない。<br class="pc">それが、リレーブックスのはじまりです。</p>

        <figure class="ph">
          <span>写真｜町の風景、または本棚の一部<br>横長 3:2 ／ 有料素材に差し替え</span>
        </figure>
      </div>
    </div>
  </section>
</main>

</body>
</html>

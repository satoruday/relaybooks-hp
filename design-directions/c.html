<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>リレーブックス｜デザイン案C 地平線と細い明朝</title>
<meta name="description" content="リレーブックスのデザイン方向性 案C。ファーストビューと「はじまり」セクションの見本。">
<link rel="stylesheet" href="fonts.css">
<style>
:root{
  --paper:#FCFCFA;
  --paper-2:#F0F1ED;
  --ink:#282B2E;
  --ink-muted:#656A6D;
  --brand:#7F6447;
  --line:#CDCEC9;
  --mincho:"Hina Mincho", serif;
  --gothic:"Zen Kaku Gothic New", sans-serif;
  --latin:"Spectral", serif;
  --gutter:clamp(1.25rem, 5vw, 5rem);
  --stroke:1px;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--gothic);
  font-weight:300;
  letter-spacing:.05em;
  line-height:2;
  font-feature-settings:"palt" 1;
}
img{display:block; max-width:100%}
:focus-visible{outline:2px solid var(--brand); outline-offset:3px}

/* ---------- ファーストビュー ---------- */
.hero{
  min-height:100dvh;
  display:grid;
  grid-template-rows:auto 1fr auto auto;
  padding-inline:var(--gutter);
  padding-block:clamp(1.5rem,4vh,3rem) clamp(2rem,6vh,3.5rem);
}
.logo{justify-self:end}
.logo img{width:clamp(146px,20vw,192px); height:auto; display:block; margin-inline-start:auto}
.catch-area{
  display:flex;
  align-items:flex-end;
  padding-block:clamp(1rem,3vh,1.75rem);
}
.catch{
  writing-mode:vertical-rl;
  margin:0;
  font-family:var(--mincho);
  font-weight:400;
  font-size:clamp(1.25rem,4.6vw,2.35rem);
  line-height:1.9;
  letter-spacing:.18em;
}
/* 地平線：受け渡しの軸として画面端から端まで通す */
.hero-rule{
  margin-inline:calc(var(--gutter) * -1);
  height:var(--stroke);
  background:var(--brand);
  transform-origin:left center;
  animation:draw-across 1700ms cubic-bezier(.16,1,.3,1) 250ms both;
}
@keyframes draw-across{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sub{
  justify-self:end;
  margin:clamp(1.25rem,4vh,2rem) 0 0;
  font-size:clamp(.82rem,3.2vw,1rem);
  letter-spacing:.16em;
  color:var(--ink-muted);
}

/* ---------- はじまり ---------- */
.story{padding-inline:var(--gutter); padding-block:clamp(5rem,14vh,10rem)}
.story-inner{
  max-width:1100px;
  margin:0 auto;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:clamp(1.5rem,5vw,4.5rem);
}
.sec-head{display:flex; gap:clamp(.85rem,2vw,1.4rem)}
.rule-s{width:var(--stroke); background:var(--line)}
.sec-title{
  writing-mode:vertical-rl;
  margin:0;
  font-family:var(--mincho);
  font-weight:400;
  font-size:clamp(1.05rem,3.6vw,1.35rem);
  letter-spacing:.32em;
  line-height:1;
}
.sec-latin{
  writing-mode:vertical-rl;
  font-family:var(--latin);
  font-weight:300;
  font-size:.72rem;
  letter-spacing:.44em;
  line-height:1;
  color:var(--ink-muted);
  margin-top:1.4em;
}
.prose{min-width:0}
.prose p{
  margin:0 0 1.85em;
  max-width:34ch;
  font-size:clamp(.94rem,3.6vw,1.02rem);
  line-height:2.15;
}
.prose p:last-of-type{margin-bottom:0}

/* 写真プレースホルダー（有料素材に差し替え） */
.ph{
  margin:clamp(3rem,8vh,5rem) 0 0;
  background:var(--paper-2);
  aspect-ratio:3/2;
  display:grid;
  place-items:center;
  padding:1.25rem;
}
.ph span{
  font-family:var(--gothic);
  font-size:.76rem;
  letter-spacing:.1em;
  line-height:1.95;
  color:var(--ink-muted);
  text-align:center;
}

@media (max-width:767px){
  .prose br.pc{display:none}
  .story-inner{gap:1.5rem}
  .prose p{max-width:none}
}
@media (prefers-reduced-motion: reduce){
  .hero-rule{animation:none}
}
</style>
</head>
<body>

<header class="hero">
  <div class="logo">
    <img src="../assets/logo/relay-books-logo.webp" width="1134" height="491"
         alt="リレーブックス RELAY BOOKS">
  </div>

  <div class="catch-area">
    <h1 class="catch">本が、人の物語になる場所。</h1>
  </div>

  <div class="hero-rule" aria-hidden="true"></div>

  <p class="sub">この町に、もう一度本屋を。</p>
</header>

<main>
  <section class="story">
    <div class="story-inner">
      <div class="sec-head">
        <div class="rule-s" aria-hidden="true"></div>
        <div>
          <h2 class="sec-title">はじまり</h2>
          <div class="sec-latin">STORY</div>
        </div>
      </div>

      <div class="prose">
        <p>【町名】には、少し前まで本屋がありました。<br class="pc">その本屋が閉まり、町から本屋がなくなりました。</p>
        <p>隣の町まで行けば本屋はあるし、ネットでも本は買えます。<br class="pc">それでも、自分の町に本屋がないことが、さみしかった。</p>
        <p>本屋は、本を売るだけの場所ではありません。<br class="pc">本に出会い、手に取り、読んでみようかなと思える場所。<br class="pc">この町から、本を読む文化をなくしたくない。<br class="pc">それが、リレーブックスのはじまりです。</p>

        <figure class="ph">
          <span>写真｜町の風景、または本棚の一部<br>横長 3:2 ／ 有料素材に差し替え</span>
        </figure>
      </div>
    </div>
  </section>
</main>

</body>
</html>
